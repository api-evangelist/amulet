aid: amulet
name: Amulet
description: >-
  Amulet is an agentic AI platform for post-sales and customer success teams,
  backed by Y Combinator (Summer 2026). It connects to a company's existing
  stack — CRM, support desk, product analytics, calls, and email — reads every
  ticket, call, and usage trend across the entire book of business, and puts AI
  agents to work monitoring account health and surfacing risk, renewal,
  expansion, and adoption signals with the supporting evidence attached. Teams
  can ask natural-language questions about any account (in-app or from Slack),
  deploy scheduled agents from templates for renewals, onboarding, and QBRs, and
  audit every agent run, with anything customer-facing held for human approval.
  As of this profile Amulet does not publish a public developer API, SDKs, or API
  documentation; this record captures the company's public web surface (product,
  pricing, legal) as a network stub.
